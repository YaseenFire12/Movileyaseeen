{#include base}
    {#title}View Patients{/title}
    <h2>View Patients</h2>
    <p>
    <table class="gridTable">
        <tr>
            <th>Patient Name</th>
            <th>Date of Birth</th>
        </tr>
        {#for patient in patients}
            <tr>
                <td><a href="{tmt:patientLink(uri, patient.id)}">{patient.name}</a></td>
                <td>{patient.dob.format('d MMM uuuu')}</td>
            </tr>
        {/for}
    </table>

{/include}
